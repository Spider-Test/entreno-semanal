<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Entreno Semanal</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Entreno">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eef1ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101512" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icono-180.png">
<link rel="icon" type="image/png" href="icono-180.png">
<link rel="stylesheet" href="estilos.css">
</head>
<body>

<section id="login" hidden>
  <h1>Entreno Semanal</h1>
  <p id="loginTexto">Entra con tu email y tu contraseña. Solo hace falta una vez en cada dispositivo.</p>
  <form id="loginForm" novalidate>
    <div>
      <label>Email <input id="email" type="email" autocomplete="username" inputmode="email" required></label>
      <label>Contraseña <input id="password" type="password" autocomplete="current-password" minlength="6" required></label>
      <div id="loginError" role="alert"></div>
      <button class="primario" id="loginBtn" type="submit">Entrar</button>
      <button class="enlace" id="modoBtn" type="button">¿Primera vez? Crear cuenta</button>
    </div>
  </form>
</section>

<section id="app" hidden>
  <header class="cabecera">
    <h1>Entreno Semanal</h1>
    <div class="tabs" role="tablist" aria-label="Vista">
      <button type="button" role="tab" id="tabSemana" aria-selected="true">Semana</button>
      <button type="button" role="tab" id="tabEjercicios" aria-selected="false">Ejercicios</button>
    </div>
  </header>

  <div id="vistaSemana">
    <nav class="nav" aria-label="Cambiar de semana">
      <button type="button" class="nav-btn flecha" id="antBtn" aria-label="Semana anterior">‹</button>
      <div class="semana-info"><span id="rango"></span><span id="relativa"></span></div>
      <button type="button" class="nav-btn flecha" id="sigBtn" aria-label="Semana siguiente">›</button>
      <button type="button" class="nav-btn" id="hoyBtn" hidden>Hoy</button>
    </nav>
    <main class="semana" id="semana"></main>
  </div>

  <div id="vistaEjercicios" hidden>
    <div class="barra">
      <input id="filtroEj" type="search" placeholder="Buscar ejercicio" aria-label="Buscar ejercicio" autocomplete="off">
      <button type="button" class="nav-btn" id="nuevoEj">+ Nuevo</button>
    </div>
    <div id="catalogo"></div>
  </div>

  <div class="pie">
    <span id="estado" role="status"></span>
    <button type="button" class="enlace" id="salirBtn">Cerrar sesión</button>
  </div>
</section>

<button type="button" id="crono" class="crono" hidden aria-live="polite">
  <span class="c-t"></span><span class="c-n"></span><span class="c-x">Toca para parar</span>
</button>

<dialog id="selector" aria-label="Elegir ejercicio">
  <form method="dialog" class="d-cab">
    <input id="buscarEj" type="search" placeholder="Busca o escribe un ejercicio nuevo" aria-label="Ejercicio" autocomplete="off" enterkeyhint="go">
    <button class="cerrar" aria-label="Cerrar">✕</button>
  </form>
  <div id="listaEj"></div>
</dialog>

<dialog id="detalle" aria-label="Ejercicio">
  <form method="dialog" class="d-cab">
    <input id="detNombre" aria-label="Nombre del ejercicio" autocomplete="off">
    <button class="cerrar" aria-label="Cerrar" autofocus>✕</button>
  </form>
  <div class="d-cuerpo">
    <section>
      <h3>Tipo</h3>
      <div class="tabs seg" id="detTipo" role="group" aria-label="Tipo de ejercicio">
        <button type="button" data-tipo="fuerza" aria-pressed="false">Fuerza</button>
        <button type="button" data-tipo="carrera" aria-pressed="false">Carrera</button>
        <button type="button" data-tipo="natacion" aria-pressed="false">Natación</button>
      </div>
    </section>
    <section>
      <h3>Vídeo de la técnica</h3>
      <div id="detEmbed"></div>
      <div class="fila">
        <input id="detVideo" type="url" inputmode="url" placeholder="Pega un enlace de YouTube, Instagram…" aria-label="Enlace del vídeo" autocomplete="off">
        <a id="detBuscar" class="nav-btn" target="_blank" rel="noopener">Buscar en YouTube</a>
      </div>
      <textarea id="detNotas" placeholder="Notas de técnica: agarre, respiración, lo que no debes olvidar…" aria-label="Notas de técnica"></textarea>
    </section>
    <section>
      <h3>Récords</h3>
      <div class="records" id="detRecords"></div>
      <ul class="marcas" id="detMarcas"></ul>
    </section>
    <section>
      <h3 id="detGraficaTit">Progreso</h3>
      <div id="detGrafica"></div>
    </section>
    <section>
      <h3>Historial</h3>
      <ol class="historial" id="detHistorial"></ol>
    </section>
    <button type="button" id="detBorrar" class="peligro">Eliminar ejercicio</button>
  </div>
</dialog>

<script src="app.js"></script>
</body>
</html>
