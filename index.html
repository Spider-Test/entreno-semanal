<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Entreno Semanal</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Entreno">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eef1ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101512" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icono-180.png">
<link rel="icon" type="image/png" href="icono-180.png">
<style>
  /* Layout: días en rejilla en pantallas anchas; en el móvil, una lista de días grandes. Pestaña aparte para el catálogo de ejercicios. */
  :root {
    --bg: #eef1ee;
    --card: #ffffff;
    --fg: #17201b;
    --muted: #64716a;
    --line: #d3dad5;
    --accent: #1d7a4f;
    --accent-soft: #e0f0e7;
    --gold: #a86b00;
    --gold-soft: #fbefd5;
    --error: #c0392b;
    --display: "Avenir Next Condensed", "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
    --body: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101512; --card: #18201b; --fg: #e6ece8; --muted: #8e9b94;
      --line: #2a352f; --accent: #4cc48a; --accent-soft: #1c3428;
      --gold: #f0b94a; --gold-soft: #3a2e14; --error: #ff7b6b; color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-top: max(12px, env(safe-area-inset-top, 0px));
    padding-bottom: max(16px, env(safe-area-inset-bottom, 0px));
    -webkit-text-size-adjust: 100%;
  }
  h1, h3 { font-family: var(--display); text-transform: uppercase; margin: 0; }
  h1 { font-weight: 700; font-size: 26px; letter-spacing: 0.04em; }
  h3 { font-weight: 700; font-size: 15px; letter-spacing: 0.08em; color: var(--muted); }
  button, input, textarea { font-family: var(--body); color: var(--fg); }
  button { cursor: pointer; }
  button:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  input, textarea { font-size: 16px; border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 8px 10px; min-width: 0; }
  .nav-btn {
    flex: none; height: 34px; min-width: 34px; padding: 0 10px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--card); color: var(--fg);
    font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; text-decoration: none;
  }
  .enlace { background: none; border: 0; color: var(--accent); font-size: 15px; padding: 6px; }
  .vacio-lista { color: var(--muted); margin: 8px 0; line-height: 1.45; }

  /* Inicio de sesión */
  #login { max-width: 360px; width: 100%; margin: 12vh auto 0; display: flex; flex-direction: column; gap: 14px; }
  #login p { margin: 0; color: var(--muted); line-height: 1.45; }
  #login form > div { display: flex; flex-direction: column; gap: 14px; }
  #login label { display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 14px; }
  #login input { font-size: 17px; padding: 12px; border-radius: 10px; }
  .primario { font-size: 17px; font-weight: 600; padding: 13px; border-radius: 10px; border: 0; background: var(--accent); color: var(--card); }
  .primario:disabled { opacity: 0.6; }
  #loginError { color: var(--error); font-size: 14px; min-height: 1em; }

  /* Estructura */
  #app { display: flex; flex-direction: column; gap: 12px; }
  .cabecera { display: flex; align-items: center; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap; }
  .tabs { display: flex; background: var(--line); border-radius: 10px; padding: 3px; gap: 2px; }
  .tabs button { border: 0; background: transparent; padding: 7px 16px; border-radius: 8px; font-weight: 600; font-size: 15px; color: var(--muted); }
  .tabs button[aria-selected="true"] { background: var(--card); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,0.12); }
  #vistaSemana, #vistaEjercicios { display: flex; flex-direction: column; gap: 12px; }
  .nav { display: flex; align-items: center; gap: 8px; }
  .nav-btn.flecha { font-size: 20px; line-height: 1; padding: 0; }
  #hoyBtn { color: var(--accent); }
  .semana-info { display: flex; flex-direction: column; align-items: center; min-width: 9.5em; line-height: 1.2; }
  #rango { font-weight: 600; font-variant-numeric: tabular-nums; }
  #relativa { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; }
  #relativa.actual { color: var(--accent); }
  .pie { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 13px; color: var(--muted); }
  #estado.error { color: var(--error); }
  #salirBtn { font-size: 13px; color: var(--muted); }

  /* Días */
  .semana { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; align-items: start; }
  .dia { display: flex; flex-direction: column; min-width: 0; background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .dia.hoy { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .dia-cab { display: flex; align-items: center; gap: 6px; padding: 6px 6px 6px 10px; border-bottom: 1px solid var(--line); }
  .dia.hoy .dia-cab { background: var(--accent-soft); }
  .dia-nombre { font-family: var(--display); font-weight: 700; font-size: 18px; text-transform: uppercase; letter-spacing: 0.05em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dia.hoy .dia-nombre { color: var(--accent); }
  .dia-fecha { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; margin-left: auto; white-space: nowrap; }
  .negrita { flex: none; width: 28px; height: 28px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); font-weight: 700; font-size: 15px; padding: 0; }
  .negrita[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--card); }
  .editor { min-height: 90px; outline: none; padding: 8px 10px; line-height: 1.45; overflow-wrap: anywhere; white-space: pre-wrap; -webkit-user-select: text; user-select: text; }
  .editor b, .editor strong { font-weight: 700; }
  .editor.vacio::before { content: attr(data-pista); color: var(--muted); opacity: 0.7; pointer-events: none; }

  /* Ejercicios dentro de un día */
  .bloques { display: flex; flex-direction: column; gap: 8px; padding: 0 8px; }
  .bloques:not(:empty) { padding-top: 8px; border-top: 1px dashed var(--line); }
  .bloque { border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px 8px; display: flex; flex-direction: column; gap: 4px; }
  .bloque-cab { display: flex; align-items: center; gap: 6px; }
  .ej-nombre { flex: 1; min-width: 0; text-align: left; border: 0; background: none; padding: 2px 0; font-weight: 700; font-size: 15px; overflow-wrap: anywhere; }
  .ej-nombre .ico { color: var(--accent); font-size: 12px; margin-left: 4px; }
  .quitar, .borrar { flex: none; border: 0; background: none; color: var(--muted); font-size: 14px; width: 26px; height: 26px; border-radius: 6px; padding: 0; }
  .series { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .series li { display: flex; align-items: center; gap: 8px; padding: 2px 0; font-variant-numeric: tabular-nums; }
  .series .n { width: 1.4em; color: var(--muted); font-size: 13px; text-align: right; }
  .series .sv { flex: 1; min-width: 0; }
  .pr { font-size: 11px; font-weight: 800; letter-spacing: 0.06em; color: var(--gold); background: var(--gold-soft); border-radius: 5px; padding: 1px 6px; }
  .nueva-serie { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) auto; align-items: center; gap: 6px; margin-top: 2px; }
  .nueva-serie input { padding: 6px 8px; text-align: center; font-variant-numeric: tabular-nums; }
  .por { color: var(--muted); }
  .anadir { border: 0; border-radius: 8px; background: var(--accent); color: var(--card); font-weight: 700; padding: 7px 10px; font-size: 14px; white-space: nowrap; }
  .add-ej { margin: 8px; border: 1px dashed var(--line); background: none; border-radius: 10px; padding: 8px; color: var(--accent); font-weight: 600; font-size: 14px; }

  /* Catálogo */
  .barra { display: flex; gap: 8px; }
  .barra input { flex: 1; }
  #catalogo { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
  .tarjeta { text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
  .t-nombre { font-weight: 700; font-size: 16px; }
  .t-nombre .ico { color: var(--accent); font-size: 12px; margin-left: 4px; }
  .t-mejor { color: var(--fg); font-variant-numeric: tabular-nums; }
  .t-ultima { color: var(--muted); font-variant-numeric: tabular-nums; }

  /* Ventanas */
  dialog { border: 0; padding: 0; border-radius: 16px; background: var(--card); color: var(--fg); width: min(560px, calc(100vw - 24px)); max-height: 88vh; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
  dialog::backdrop { background: rgba(0,0,0,0.45); }
  .d-cab { position: sticky; top: 0; background: var(--card); display: flex; align-items: center; gap: 8px; padding: 12px 12px 10px 16px; border-bottom: 1px solid var(--line); z-index: 1; }
  .d-cab input { flex: 1; font-weight: 700; font-size: 18px; border-color: transparent; padding: 6px 8px; margin-left: -8px; }
  .d-cab input:hover, .d-cab input:focus { border-color: var(--line); }
  .cerrar { flex: none; border: 0; background: var(--bg); width: 32px; height: 32px; border-radius: 16px; font-size: 15px; color: var(--muted); }
  .d-cuerpo { padding: 14px 16px 18px; display: flex; flex-direction: column; gap: 18px; }
  .d-cuerpo section { display: flex; flex-direction: column; gap: 8px; }
  .fila { display: flex; gap: 8px; flex-wrap: wrap; }
  .fila input { flex: 1 1 200px; }
  .video { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; background: #000; }
  .video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  #detEmbed { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
  #detEmbed:empty { display: none; }
  .abrir-video { display: inline-flex; align-self: flex-start; gap: 6px; padding: 8px 12px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); font-weight: 600; text-decoration: none; }
  #detNotas { width: 100%; min-height: 64px; resize: vertical; line-height: 1.4; }
  .records { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
  .rec { background: var(--bg); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
  .rec .r-et { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .rec .r-val { font-family: var(--display); font-weight: 700; font-size: 24px; font-variant-numeric: tabular-nums; }
  .rec .r-sub { font-size: 12px; color: var(--muted); }
  .rec.oro .r-val { color: var(--gold); }
  .graf { width: 100%; height: auto; display: block; }
  .g-rejilla { stroke: var(--line); stroke-width: 1; }
  .g-area { fill: var(--accent); opacity: 0.12; }
  .g-linea { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
  .g-punto { fill: var(--card); stroke: var(--accent); stroke-width: 2; }
  .g-fin { fill: var(--accent); }
  .g-txt { fill: var(--muted); font-size: 10px; font-family: var(--body); }
  .historial { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .historial li { display: grid; grid-template-columns: 6.5em 1fr; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  .historial .h-f { color: var(--muted); font-size: 14px; }
  .historial .h-s { display: flex; flex-wrap: wrap; gap: 4px 10px; }
  .historial .h-s .es-pr { color: var(--gold); font-weight: 700; }
  .peligro { align-self: flex-start; border: 1px solid var(--line); background: none; color: var(--error); border-radius: 8px; padding: 8px 12px; font-weight: 600; }
  .peligro.confirmar { background: var(--error); color: var(--card); border-color: var(--error); }
  #listaEj { display: flex; flex-direction: column; padding: 6px 8px 12px; max-height: 55vh; overflow-y: auto; }
  .opcion { text-align: left; border: 0; background: none; padding: 12px 10px; border-radius: 8px; font-size: 16px; border-bottom: 1px solid var(--line); }
  .opcion:hover, .opcion:focus { background: var(--bg); }
  .opcion.crear { color: var(--accent); font-weight: 700; }

  @media (max-width: 760px) {
    body { font-size: 17px; }
    h1 { font-size: 30px; }
    .cabecera .tabs { width: 100%; }
    .tabs button { flex: 1; padding: 9px 0; font-size: 16px; }
    .nav { width: 100%; justify-content: space-between; }
    .nav-btn { height: 44px; min-width: 44px; border-radius: 10px; font-size: 16px; }
    .nav-btn.flecha { font-size: 24px; }
    .semana-info { flex: 1; }
    #rango { font-size: 17px; }
    .semana { grid-template-columns: 1fr; gap: 14px; }
    .dia { border-radius: 14px; }
    .dia-cab { padding: 10px 10px 10px 14px; gap: 10px; }
    .dia-nombre { font-size: 26px; }
    .dia-fecha { font-size: 15px; }
    .negrita { width: 40px; height: 40px; font-size: 19px; border-radius: 9px; }
    .editor { min-height: 120px; padding: 12px 14px; font-size: 17px; line-height: 1.5; }
    .bloques { padding: 0 10px; }
    .bloque { padding: 8px 10px 10px; }
    .ej-nombre { font-size: 17px; }
    .series li { font-size: 17px; padding: 4px 0; }
    .quitar, .borrar { width: 36px; height: 36px; font-size: 16px; }
    .nueva-serie input { font-size: 18px; padding: 9px 8px; }
    .anadir { padding: 11px 12px; font-size: 16px; }
    .add-ej { margin: 10px; padding: 12px; font-size: 16px; }
    dialog { width: 100vw; max-width: 100vw; max-height: 92vh; margin: auto 0 0; border-radius: 18px 18px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
  }
</style>
</head>
<body>

<section id="login" hidden>
  <h1>Entreno Semanal</h1>
  <p id="loginTexto">Entra con tu email y tu contraseña. Solo hace falta una vez en cada dispositivo.</p>
  <form id="loginForm" novalidate>
    <div>
      <label>Email <input id="email" type="email" autocomplete="username" inputmode="email" required></label>
      <label>Contraseña <input id="password" type="password" autocomplete="current-password" minlength="6" required></label>
      <div id="loginError" role="alert"></div>
      <button class="primario" id="loginBtn" type="submit">Entrar</button>
      <button class="enlace" id="modoBtn" type="button">¿Primera vez? Crear cuenta</button>
    </div>
  </form>
</section>

<section id="app" hidden>
  <header class="cabecera">
    <h1>Entreno Semanal</h1>
    <div class="tabs" role="tablist" aria-label="Vista">
      <button type="button" role="tab" id="tabSemana" aria-selected="true">Semana</button>
      <button type="button" role="tab" id="tabEjercicios" aria-selected="false">Ejercicios</button>
    </div>
  </header>

  <div id="vistaSemana">
    <nav class="nav" aria-label="Cambiar de semana">
      <button type="button" class="nav-btn flecha" id="antBtn" aria-label="Semana anterior">‹</button>
      <div class="semana-info"><span id="rango"></span><span id="relativa"></span></div>
      <button type="button" class="nav-btn flecha" id="sigBtn" aria-label="Semana siguiente">›</button>
      <button type="button" class="nav-btn" id="hoyBtn" hidden>Hoy</button>
    </nav>
    <main class="semana" id="semana"></main>
  </div>

  <div id="vistaEjercicios" hidden>
    <div class="barra">
      <input id="filtroEj" type="search" placeholder="Buscar ejercicio" aria-label="Buscar ejercicio" autocomplete="off">
      <button type="button" class="nav-btn" id="nuevoEj">+ Nuevo</button>
    </div>
    <div id="catalogo"></div>
  </div>

  <div class="pie">
    <span id="estado" role="status"></span>
    <button type="button" class="enlace" id="salirBtn">Cerrar sesión</button>
  </div>
</section>

<dialog id="selector" aria-label="Elegir ejercicio">
  <form method="dialog" class="d-cab">
    <input id="buscarEj" type="search" placeholder="Busca o escribe un ejercicio nuevo" aria-label="Ejercicio" autocomplete="off" enterkeyhint="go">
    <button class="cerrar" aria-label="Cerrar">✕</button>
  </form>
  <div id="listaEj"></div>
</dialog>

<dialog id="detalle" aria-label="Ejercicio">
  <form method="dialog" class="d-cab">
    <input id="detNombre" aria-label="Nombre del ejercicio" autocomplete="off">
    <button class="cerrar" aria-label="Cerrar" autofocus>✕</button>
  </form>
  <div class="d-cuerpo">
    <section>
      <h3>Vídeo de la técnica</h3>
      <div id="detEmbed"></div>
      <div class="fila">
        <input id="detVideo" type="url" inputmode="url" placeholder="Pega un enlace de YouTube, Instagram…" aria-label="Enlace del vídeo" autocomplete="off">
        <a id="detBuscar" class="nav-btn" target="_blank" rel="noopener">Buscar en YouTube</a>
      </div>
      <textarea id="detNotas" placeholder="Notas de técnica: agarre, respiración, lo que no debes olvidar…" aria-label="Notas de técnica"></textarea>
    </section>
    <section>
      <h3>Récords</h3>
      <div class="records" id="detRecords"></div>
    </section>
    <section>
      <h3 id="detGraficaTit">Progreso</h3>
      <div id="detGrafica"></div>
    </section>
    <section>
      <h3>Historial</h3>
      <ol class="historial" id="detHistorial"></ol>
    </section>
    <button type="button" id="detBorrar" class="peligro">Eliminar ejercicio</button>
  </div>
</dialog>

<script>
  const SUPA = "https://qtdvehlewuuljolistlw.supabase.co";
  const CLAVE = "sb_publishable_1W_oC99R9By_5iGixwbEqw_rogdHvoQ";   // clave pública; los datos los protegen las reglas de las tablas

  const DIAS = ["lunes", "martes", "miercoles", "jueves", "viernes", "sabado", "domingo"];
  const NOMBRES = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado", "Domingo"];
  const MESES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
  const PISTAS = ["Ej.: Pierna — sentadilla 5×5, peso muerto 3×5", "Ej.: Correr 8 km suave", "Ej.: Torso — press banca 4×8",
                  "Ej.: Descanso activo, movilidad 20 min", "Ej.: Series 6×400 m", "Ej.: Tirada larga 15 km", "Ej.: Descanso"];
  const $ = id => document.getElementById(id);

  // ---------- Almacenamiento local (funciona sin conexión) ----------
  const leer = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
  const escribir = (k, v) => { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch {} };

  // Cada tabla se sincroniza igual: gana la edición más reciente de cada fila
  const TABLAS = {
    ejercicios: { clave: "id", conflicto: "id", campos: ["id", "nombre", "video_url", "notas", "borrado", "actualizado"] },
    series: { clave: "id", conflicto: "id", campos: ["id", "fecha", "ejercicio_id", "orden", "peso", "reps", "borrado", "actualizado"] },
    entrenos: { clave: "fecha", conflicto: "user_id,fecha", campos: ["fecha", "html", "texto", "actualizado"] }
  };
  let sesion = leer("sesion-v1");                 // {access_token, refresh_token, expires_at, user_id, email}
  let db = leer("datos-v2");
  if (!db) { db = { entrenos: leer("entrenos-v1") || {}, ejercicios: {}, series: {} }; }
  let cursores = leer("cursores-v2") || {};       // última marca de servidor leída por tabla
  let enEspera = leer("bloques-v1") || {};        // fecha -> ejercicios añadidos que aún no tienen series
  const guardarLocal = () => { escribir("datos-v2", db); escribir("cursores-v2", cursores); };
  const guardarEspera = () => escribir("bloques-v1", enEspera);

  const estado = $("estado");
  const setEstado = (t, err) => { estado.textContent = t; estado.classList.toggle("error", !!err); };

  // ---------- Fechas y números ----------
  const iso = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  const deIso = s => { const p = s.split("-").map(Number); return new Date(p[0], p[1] - 1, p[2]); };
  const lunesDe = d => { const l = new Date(d.getFullYear(), d.getMonth(), d.getDate()); l.setDate(l.getDate() - (l.getDay() + 6) % 7); return l; };
  const sumarDias = (d, n) => { const r = new Date(d); r.setDate(r.getDate() + n); return r; };
  const fmt = d => d.getDate() + " " + MESES[d.getMonth()];
  const fechaCorta = s => { const d = deIso(s); return fmt(d) + (d.getFullYear() !== new Date().getFullYear() ? " " + d.getFullYear() : ""); };
  const num = n => (+n).toLocaleString("es-ES", { maximumFractionDigits: 2 });
  const rm = s => +s.reps <= 1 ? +s.peso : +s.peso * (1 + s.reps / 30);    // 1RM estimado (Epley)
  const serieTexto = s => +s.peso > 0 ? num(s.peso) + " kg × " + s.reps : s.reps + " reps";
  const norm = t => (t || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
  const nuevoId = () => crypto.randomUUID ? crypto.randomUUID() : "10000000-1000-4000-8000-100000000000".replace(/[018]/g, c => (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16));
  let desplazamiento = 0;   // semanas respecto a la actual
  const lunesVista = () => sumarDias(lunesDe(new Date()), desplazamiento * 7);

  // ---------- Texto del día: solo saltos de línea y negrita ----------
  function limpiar(html) {
    const tpl = document.createElement("template");
    tpl.innerHTML = html;
    const salida = document.createElement("div");
    (function copiar(origen, destino) {
      origen.childNodes.forEach(n => {
        if (n.nodeType === 3) { destino.appendChild(document.createTextNode(n.nodeValue)); return; }
        if (n.nodeType !== 1) return;
        const tag = n.tagName;
        const peso = n.style && n.style.fontWeight;
        let nuevo = null;
        if (tag === "BR") { destino.appendChild(document.createElement("br")); return; }
        if (tag === "B" || tag === "STRONG" || peso === "bold" || +peso >= 600) nuevo = document.createElement("b");
        else if (tag === "DIV" || tag === "P") nuevo = document.createElement("div");
        if (nuevo) { copiar(n, nuevo); destino.appendChild(nuevo); } else copiar(n, destino);
      });
    })(tpl.content, salida);
    return salida.innerHTML;
  }
  const aTexto = html => { const t = document.createElement("div"); t.innerHTML = html.replace(/<br>/g, "\n").replace(/<div>/g, "\n"); return t.textContent.replace(/^\n/, ""); };
  const marcarVacio = ed => ed.classList.toggle("vacio", ed.textContent.trim() === "");

  // ---------- Datos derivados: ejercicios, series y récords ----------
  const ejercicioVivo = id => { const e = db.ejercicios[id]; return e && !e.borrado ? e : null; };
  const seriesVivas = () => Object.values(db.series).filter(s => !s.borrado && ejercicioVivo(s.ejercicio_id));
  const ordenSerie = (a, b) => a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : a.orden - b.orden;
  const seriesDe = id => seriesVivas().filter(s => s.ejercicio_id === id).sort(ordenSerie);
  // Una serie es PR si supera el mejor peso anterior (o las mejores repeticiones, sin peso)
  function prsDe(lista) {
    const prs = new Set(); let maxP = null, maxR = null;
    lista.forEach(s => {
      if (+s.peso > 0) { if (maxP !== null && +s.peso > maxP) prs.add(s.id); maxP = Math.max(maxP ?? 0, +s.peso); }
      else { if (maxR !== null && +s.reps > maxR) prs.add(s.id); maxR = Math.max(maxR ?? 0, +s.reps); }
    });
    return prs;
  }
  function ejerciciosOrdenados() {
    const ultimo = {};
    seriesVivas().forEach(s => { if (!ultimo[s.ejercicio_id] || s.fecha > ultimo[s.ejercicio_id]) ultimo[s.ejercicio_id] = s.fecha; });
    return Object.values(db.ejercicios).filter(e => !e.borrado)
      .sort((a, b) => (ultimo[b.id] || "").localeCompare(ultimo[a.id] || "") || a.nombre.localeCompare(b.nombre, "es"));
  }
  function porSesion(lista) {
    const ses = {};
    lista.forEach(s => (ses[s.fecha] = ses[s.fecha] || []).push(s));
    return Object.keys(ses).sort().map(f => ({ fecha: f, series: ses[f] }));
  }
  function estadisticas(id) {
    const lista = seriesDe(id);
    if (!lista.length) return { lista, resumen: "Sin series todavía", ultima: "" };
    const pesadas = lista.filter(s => +s.peso > 0);
    const sesiones = porSesion(lista);
    const ult = sesiones[sesiones.length - 1];
    const st = { lista, sesiones, ultima: "Última vez: " + fechaCorta(ult.fecha) + " · " + ult.series.slice(0, 4).map(serieTexto).join(", ") + (ult.series.length > 4 ? "…" : "") };
    if (pesadas.length) {
      st.mejor = pesadas.reduce((m, s) => +s.peso > +m.peso || (+s.peso === +m.peso && +s.reps > +m.reps) ? s : m);
      st.mejorRm = pesadas.reduce((m, s) => rm(s) > rm(m) ? s : m);
      st.resumen = "Récord: " + serieTexto(st.mejor) + " · 1RM est. " + num(Math.round(rm(st.mejorRm))) + " kg";
    } else {
      st.mejorReps = lista.reduce((m, s) => +s.reps > +m.reps ? s : m);
      st.resumen = "Récord: " + st.mejorReps.reps + " reps";
    }
    return st;
  }

  // ---------- Conexión con Supabase ----------
  function guardarSesion(j) {
    sesion = {
      access_token: j.access_token, refresh_token: j.refresh_token,
      expires_at: j.expires_at || Math.floor(Date.now() / 1000) + (j.expires_in || 3600),
      user_id: j.user.id, email: j.user.email
    };
    escribir("sesion-v1", sesion);
  }
  class SesionCaducada extends Error {}
  async function refrescar() {
    const r = await fetch(SUPA + "/auth/v1/token?grant_type=refresh_token", {
      method: "POST", headers: { apikey: CLAVE, "Content-Type": "application/json" },
      body: JSON.stringify({ refresh_token: sesion.refresh_token })
    });
    if (r.status === 400 || r.status === 401) throw new SesionCaducada();
    if (!r.ok) throw new Error("refresh " + r.status);
    guardarSesion(await r.json());
  }
  async function api(ruta, opciones = {}, reintento = false) {
    if (sesion.expires_at * 1000 - 60000 < Date.now()) await refrescar();
    const r = await fetch(SUPA + ruta, {
      ...opciones,
      headers: { apikey: CLAVE, Authorization: "Bearer " + sesion.access_token, "Content-Type": "application/json", ...(opciones.headers || {}) }
    });
    if (r.status === 401 && !reintento) { await refrescar(); return api(ruta, opciones, true); }
    return r;
  }

  // Guarda una edición en el dispositivo y la deja pendiente de subir
  let timerSync;
  function cambiar(tabla, fila) {
    fila.actualizado = new Date().toISOString();
    fila.sucio = true;
    db[tabla][fila[TABLAS[tabla].clave]] = fila;
    guardarLocal();
    setEstado("Guardado en el dispositivo");
    clearTimeout(timerSync);
    timerSync = setTimeout(sincronizar, 1000);
  }
  function mezclar(tabla, f) {
    const k = f[TABLAS[tabla].clave], local = db[tabla][k];
    const tr = Date.parse(f.actualizado), tl = local ? Date.parse(local.actualizado) : 0;
    if (local && ((local.sucio && tr <= tl) || (!local.sucio && tr === tl))) return false;
    const fila = {};
    TABLAS[tabla].campos.forEach(c => { fila[c] = f[c]; });
    fila.actualizado = new Date(tr).toISOString();
    fila.sucio = false;
    db[tabla][k] = fila;
    return true;
  }
  const hayPendientes = () => Object.keys(TABLAS).some(t => Object.values(db[t]).some(v => v.sucio));

  let sincronizando = false, repetir = false;
  async function sincronizar() {
    if (!sesion) return;
    if (sincronizando) { repetir = true; return; }
    sincronizando = true;
    try {
      do {
        repetir = false;
        let cambio = false;
        // Bajar solo lo que ha cambiado en el servidor (con 5 s de margen)
        for (const t of Object.keys(TABLAS)) {
          const desde = cursores[t] ? "&servidor_ts=gte." + encodeURIComponent(new Date(Date.parse(cursores[t]) - 5000).toISOString()) : "";
          const r = await api("/rest/v1/" + t + "?select=" + TABLAS[t].campos.join(",") + ",servidor_ts&order=servidor_ts.asc" + desde);
          if (!r.ok) throw new Error("leer " + t + " " + r.status);
          for (const f of await r.json()) {
            if (mezclar(t, f)) cambio = true;
            if (!cursores[t] || Date.parse(f.servidor_ts) > Date.parse(cursores[t])) cursores[t] = f.servidor_ts;
          }
        }
        guardarLocal();
        if (cambio) pintarTodo();
        // Subir lo pendiente (primero los ejercicios, luego sus series)
        for (const t of Object.keys(TABLAS)) {
          const pend = Object.values(db[t]).filter(v => v.sucio);
          if (!pend.length) continue;
          const filas = pend.map(v => { const f = { user_id: sesion.user_id }; TABLAS[t].campos.forEach(c => { f[c] = v[c]; }); return f; });
          const w = await api("/rest/v1/" + t + "?on_conflict=" + TABLAS[t].conflicto, {
            method: "POST", headers: { Prefer: "resolution=merge-duplicates,return=minimal" }, body: JSON.stringify(filas)
          });
          if (!w.ok) throw new Error("guardar " + t + " " + w.status);
          filas.forEach(f => { const v = db[t][f[TABLAS[t].clave]]; if (v && v.actualizado === f.actualizado) v.sucio = false; });
          guardarLocal();
        }
      } while (repetir);
      setEstado("Sincronizado");
    } catch (e) {
      if (e instanceof SesionCaducada) cerrarSesion("Tu sesión ha caducado. Vuelve a entrar; lo que escribiste sigue guardado en este dispositivo.");
      else setEstado(hayPendientes() ? "Sin conexión · guardado en el dispositivo, se subirá al volver la conexión" : "Sin conexión · mostrando lo último guardado");
    } finally {
      sincronizando = false;
    }
  }

  // ---------- Semana ----------
  const dias = DIAS.map((_, i) => {
    const col = document.createElement("section");
    col.className = "dia";
    col.innerHTML = '<div class="dia-cab"><span class="dia-nombre"></span><span class="dia-fecha"></span>' +
                    '<button type="button" class="negrita" aria-pressed="false" title="Negrita (⌘B)">N</button></div>' +
                    '<div class="editor vacio" role="textbox" aria-multiline="true" contenteditable="true"></div>' +
                    '<div class="bloques"></div><button type="button" class="add-ej">+ Ejercicio</button>';
    col.querySelector(".dia-nombre").textContent = NOMBRES[i];
    const ed = col.querySelector(".editor");
    const btn = col.querySelector(".negrita");
    ed.id = "e-" + DIAS[i];
    ed.dataset.pista = PISTAS[i];
    ed.setAttribute("aria-label", "Entrenamiento del " + NOMBRES[i]);
    btn.setAttribute("aria-label", "Negrita en " + NOMBRES[i]);
    $("semana").appendChild(col);
    const dia = { i, col, ed, btn, fechaEl: col.querySelector(".dia-fecha"), bloquesEl: col.querySelector(".bloques"), id: "" };
    col.querySelector(".add-ej").addEventListener("click", () => abrirSelector(dia));
    return dia;
  });

  // Pone en cada día su texto guardado (sin tocar el que se está escribiendo)
  function rellenar() {
    dias.forEach(({ id, ed }) => {
      if (document.activeElement === ed) return;
      const nuevo = limpiar(db.entrenos[id]?.html || "");
      if (limpiar(ed.innerHTML) !== nuevo) ed.innerHTML = nuevo;
      marcarVacio(ed);
    });
  }

  function pintarSemana() {
    const lunes = lunesVista();
    const hoyIso = iso(new Date());
    $("rango").textContent = fmt(lunes) + " – " + fmt(sumarDias(lunes, 6));
    const n = desplazamiento, rel = $("relativa");
    rel.textContent = n === 0 ? "Esta semana" : n === -1 ? "Semana pasada" : n === 1 ? "Próxima semana"
                    : n < 0 ? "Hace " + -n + " semanas" : "Dentro de " + n + " semanas";
    rel.classList.toggle("actual", n === 0);
    $("hoyBtn").hidden = n === 0;
    dias.forEach(d => {
      const f = sumarDias(lunes, d.i);
      d.id = iso(f);
      d.fechaEl.textContent = fmt(f);
      d.col.classList.toggle("hoy", d.id === hoyIso);
      d.ed.innerHTML = "";
    });
    rellenar();
    pintarBloques(true);
  }

  function editado(dia) {
    const html = limpiar(dia.ed.innerHTML);
    marcarVacio(dia.ed);
    cambiar("entrenos", { fecha: dia.id, html, texto: aTexto(html) });
  }

  dias.forEach(dia => {
    const { ed, btn } = dia;
    ed.addEventListener("input", () => editado(dia));
    ed.addEventListener("blur", () => rellenar());
    ed.addEventListener("paste", e => {   // pegar siempre como texto sin formato
      e.preventDefault();
      document.execCommand("insertText", false, (e.clipboardData || window.clipboardData).getData("text/plain"));
    });
    btn.addEventListener("pointerdown", e => e.preventDefault());   // que el botón no quite el foco
    btn.addEventListener("mousedown", e => e.preventDefault());
    btn.addEventListener("click", () => {
      if (document.activeElement !== ed) {
        ed.focus();
        const r = document.createRange(); r.selectNodeContents(ed); r.collapse(false);
        const s = getSelection(); s.removeAllRanges(); s.addRange(r);
      }
      document.execCommand("bold");
      btn.setAttribute("aria-pressed", document.queryCommandState("bold") ? "true" : "false");
      editado(dia);
    });
  });
  document.addEventListener("selectionchange", () => {
    dias.forEach(({ ed, btn }) => {
      btn.setAttribute("aria-pressed", document.activeElement === ed && document.queryCommandState("bold") ? "true" : "false");
    });
  });

  // ---------- Ejercicios de cada día ----------
  let repintarLuego = false;
  const escribiendoSerie = () => document.activeElement && document.activeElement.closest && document.activeElement.closest(".bloques");
  function pintarBloques(forzar) {
    if (!forzar && escribiendoSerie()) { repintarLuego = true; return; }
    repintarLuego = false;
    dias.forEach(pintarDia);
  }
  $("semana").addEventListener("focusout", () => setTimeout(() => { if (repintarLuego && !escribiendoSerie()) pintarBloques(); }, 0));

  function quitarEspera(fecha, id) {
    if (!enEspera[fecha]) return;
    enEspera[fecha] = enEspera[fecha].filter(x => x !== id);
    if (!enEspera[fecha].length) delete enEspera[fecha];
    guardarEspera();
  }

  function pintarDia(dia) {
    const cont = dia.bloquesEl;
    cont.textContent = "";
    const delDia = seriesVivas().filter(s => s.fecha === dia.id).sort((a, b) => a.orden - b.orden);
    const ids = [];
    delDia.forEach(s => { if (!ids.includes(s.ejercicio_id)) ids.push(s.ejercicio_id); });
    (enEspera[dia.id] || []).forEach(id => { if (!ids.includes(id) && ejercicioVivo(id)) ids.push(id); });
    ids.forEach(id => cont.appendChild(bloque(dia, id, delDia.filter(s => s.ejercicio_id === id))));
  }

  function bloque(dia, id, series) {
    const ej = db.ejercicios[id];
    const historia = seriesDe(id);
    const prs = prsDe(historia);
    const b = document.createElement("div");
    b.className = "bloque";
    b.dataset.ej = id;
    b.innerHTML = '<div class="bloque-cab"><button type="button" class="ej-nombre"></button><button type="button" class="quitar" aria-label="Quitar ejercicio">✕</button></div>' +
      '<ol class="series"></ol>' +
      '<form class="nueva-serie"><input class="in-peso" inputmode="decimal" placeholder="kg" aria-label="Peso en kg" autocomplete="off" enterkeyhint="next">' +
      '<span class="por">×</span><input class="in-reps" inputmode="numeric" pattern="[0-9]*" placeholder="reps" aria-label="Repeticiones" autocomplete="off" enterkeyhint="done">' +
      '<button class="anadir">+ Serie</button></form>';
    const nom = b.querySelector(".ej-nombre");
    nom.textContent = ej.nombre || "Sin nombre";
    if (ej.video_url) { const v = document.createElement("span"); v.className = "ico"; v.textContent = "▶ vídeo"; nom.appendChild(v); }
    nom.setAttribute("aria-label", "Ver " + (ej.nombre || "ejercicio") + ": vídeo, récords e historial");
    nom.addEventListener("click", () => abrirDetalle(id));
    const quitar = b.querySelector(".quitar");
    if (series.length) quitar.remove();
    else quitar.addEventListener("click", () => { quitarEspera(dia.id, id); pintarDia(dia); });

    const ol = b.querySelector(".series");
    series.forEach((s, i) => {
      const li = document.createElement("li");
      li.innerHTML = '<span class="n"></span><span class="sv"></span><button type="button" class="borrar">✕</button>';
      li.querySelector(".n").textContent = i + 1;
      li.querySelector(".sv").textContent = serieTexto(s);
      li.querySelector(".borrar").setAttribute("aria-label", "Borrar serie " + (i + 1));
      if (prs.has(s.id)) { const p = document.createElement("span"); p.className = "pr"; p.textContent = "PR"; p.title = "Récord personal"; li.querySelector(".sv").after(p); }
      li.querySelector(".borrar").addEventListener("click", () => { cambiar("series", { ...s, borrado: true }); pintarBloques(true); });
      ol.appendChild(li);
    });

    // Rellena con la última serie de este ejercicio para registrar rápido
    const fp = b.querySelector(".in-peso"), fr = b.querySelector(".in-reps");
    const ult = series[series.length - 1] || historia[historia.length - 1];
    if (ult) { fp.value = +ult.peso > 0 ? num(ult.peso) : ""; fr.value = ult.reps; }
    fp.addEventListener("focus", () => fp.select());
    fr.addEventListener("focus", () => fr.select());
    fp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); fr.focus(); } });
    b.querySelector("form").addEventListener("submit", e => {
      e.preventDefault();
      const peso = parseFloat((fp.value.trim() || "0").replace(",", "."));
      const reps = parseInt(fr.value, 10);
      if (!(reps > 0)) { fr.focus(); return; }
      if (!(peso >= 0)) { fp.focus(); return; }
      cambiar("series", { id: nuevoId(), fecha: dia.id, ejercicio_id: id, orden: Date.now(), peso, reps, borrado: false });
      quitarEspera(dia.id, id);
      pintarBloques(true);
      const otra = dia.bloquesEl.querySelector('[data-ej="' + id + '"] .anadir');
      if (otra) otra.focus();
    });
    return b;
  }

  // ---------- Elegir o crear ejercicio ----------
  let diaSelector = null;
  function crearEjercicio(nombre) {
    const id = nuevoId();
    cambiar("ejercicios", { id, nombre: nombre.trim(), video_url: "", notas: "", borrado: false });
    return id;
  }
  function abrirSelector(dia) {
    diaSelector = dia;
    $("buscarEj").value = "";
    pintarSelector();
    $("selector").showModal();
    $("buscarEj").focus();
  }
  function opcion(texto, alElegir, crear) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "opcion" + (crear ? " crear" : "");
    b.textContent = texto;
    b.addEventListener("click", alElegir);
    return b;
  }
  function elegir(id) {
    const dia = diaSelector;
    $("selector").close();
    const yaTiene = seriesVivas().some(s => s.fecha === dia.id && s.ejercicio_id === id);
    if (!yaTiene) { enEspera[dia.id] = (enEspera[dia.id] || []).filter(x => x !== id).concat(id); guardarEspera(); }
    pintarDia(dia);
    const inp = dia.bloquesEl.querySelector('[data-ej="' + id + '"] .in-peso');
    if (inp) { inp.scrollIntoView({ block: "center", behavior: "smooth" }); inp.focus(); }
  }
  function pintarSelector() {
    const q = $("buscarEj").value.trim(), lista = $("listaEj");
    lista.textContent = "";
    const ejs = ejerciciosOrdenados().filter(e => norm(e.nombre).includes(norm(q)));
    if (q && !ejs.some(e => norm(e.nombre) === norm(q))) lista.appendChild(opcion("+ Crear «" + q + "»", () => elegir(crearEjercicio(q)), true));
    ejs.forEach(e => lista.appendChild(opcion(e.nombre, () => elegir(e.id))));
    if (!lista.children.length) {
      const p = document.createElement("p");
      p.className = "vacio-lista";
      p.textContent = "Escribe el nombre del ejercicio (por ejemplo, Press banca) para crearlo.";
      lista.appendChild(p);
    }
  }
  $("buscarEj").addEventListener("input", pintarSelector);
  $("buscarEj").addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); const primera = $("listaEj").querySelector(".opcion"); if (primera) primera.click(); }
  });

  // ---------- Catálogo de ejercicios ----------
  function pintarCatalogo() {
    const cont = $("catalogo"), q = $("filtroEj").value.trim();
    cont.textContent = "";
    const ejs = ejerciciosOrdenados().filter(e => norm(e.nombre).includes(norm(q)));
    if (!ejs.length) {
      const p = document.createElement("p");
      p.className = "vacio-lista";
      p.textContent = q ? "No hay ningún ejercicio con ese nombre. Pulsa «+ Nuevo» para crearlo."
                        : "Aún no tienes ejercicios. Añádelos desde un día con «+ Ejercicio» o pulsa «+ Nuevo».";
      cont.appendChild(p);
      return;
    }
    ejs.forEach(e => {
      const st = estadisticas(e.id);
      const t = document.createElement("button");
      t.type = "button";
      t.className = "tarjeta";
      t.innerHTML = '<span class="t-nombre"></span><span class="t-mejor"></span><span class="t-ultima"></span>';
      t.querySelector(".t-nombre").textContent = e.nombre || "Sin nombre";
      if (e.video_url) { const v = document.createElement("span"); v.className = "ico"; v.textContent = "▶ vídeo"; t.querySelector(".t-nombre").appendChild(v); }
      t.querySelector(".t-mejor").textContent = st.resumen;
      t.querySelector(".t-ultima").textContent = st.ultima;
      if (!st.ultima) t.querySelector(".t-ultima").remove();
      t.addEventListener("click", () => abrirDetalle(e.id));
      cont.appendChild(t);
    });
  }
  $("filtroEj").addEventListener("input", pintarCatalogo);
  $("nuevoEj").addEventListener("click", () => {
    const id = crearEjercicio($("filtroEj").value.trim() || "Nuevo ejercicio");
    pintarCatalogo();
    abrirDetalle(id);
    $("detNombre").select();
  });

  // ---------- Ficha del ejercicio: vídeo, récords, progreso e historial ----------
  let detalleId = null;
  function idYoutube(u) {
    try {
      const x = new URL(u);
      if (/(^|\.)youtu\.be$/.test(x.hostname)) return x.pathname.slice(1).split("/")[0] || null;
      if (/(^|\.)youtube(-nocookie)?\.com$/.test(x.hostname)) {
        if (x.searchParams.get("v")) return x.searchParams.get("v");
        const m = x.pathname.match(/\/(shorts|embed|live)\/([\w-]+)/);
        if (m) return m[2];
      }
    } catch {}
    return null;
  }
  function pintarVideo(e) {
    const cont = $("detEmbed");
    cont.textContent = "";
    const yt = idYoutube(e.video_url);
    if (yt) {
      const w = document.createElement("div"); w.className = "video";
      const f = document.createElement("iframe");
      f.src = "https://www.youtube-nocookie.com/embed/" + encodeURIComponent(yt) + "?playsinline=1&rel=0";
      f.title = "Vídeo: " + e.nombre;
      f.allow = "accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen";
      f.allowFullscreen = true;
      f.referrerPolicy = "strict-origin-when-cross-origin";   // YouTube necesita saber desde qué web se reproduce
      w.appendChild(f); cont.appendChild(w);
      const a = document.createElement("a");
      a.href = "https://www.youtube.com/watch?v=" + encodeURIComponent(yt); a.target = "_blank"; a.rel = "noopener"; a.className = "enlace";
      a.textContent = "Abrir en YouTube";
      cont.appendChild(a);
    } else if (/^https?:\/\//i.test(e.video_url)) {
      const a = document.createElement("a");
      a.href = e.video_url; a.target = "_blank"; a.rel = "noopener"; a.className = "abrir-video";
      a.textContent = "▶ Abrir vídeo";
      cont.appendChild(a);
    }
    $("detBuscar").href = "https://www.youtube.com/results?search_query=" + encodeURIComponent((e.nombre || "") + " técnica");
  }
  function recuadro(etiqueta, valor, sub, oro) {
    const d = document.createElement("div");
    d.className = "rec" + (oro ? " oro" : "");
    d.innerHTML = '<span class="r-et"></span><span class="r-val"></span><span class="r-sub"></span>';
    d.querySelector(".r-et").textContent = etiqueta;
    d.querySelector(".r-val").textContent = valor;
    d.querySelector(".r-sub").textContent = sub || "";
    return d;
  }
  function grafica(puntos, unidad) {
    if (puntos.length < 2) return '<p class="vacio-lista">La gráfica aparece cuando tengas dos sesiones o más.</p>';
    const W = 320, H = 130, pl = 6, pr = 6, pt = 18, pb = 22;
    const vals = puntos.map(p => p.v);
    let min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    if (max === min) { min -= 1; max += 1; }
    const x = i => pl + i * (W - pl - pr) / (puntos.length - 1);
    const y = v => pt + (1 - (v - min) / (max - min)) * (H - pt - pb);
    const linea = puntos.map((p, i) => x(i).toFixed(1) + "," + y(p.v).toFixed(1)).join(" ");
    const area = "M" + x(0).toFixed(1) + "," + (H - pb) + " L" + linea.split(" ").join(" L") + " L" + x(puntos.length - 1).toFixed(1) + "," + (H - pb) + " Z";
    let svg = '<svg viewBox="0 0 ' + W + " " + H + '" class="graf" role="img" aria-label="Progreso por sesión">';
    svg += '<line class="g-rejilla" x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(max) + '" y2="' + y(max) + '"/>';
    svg += '<line class="g-rejilla" x1="' + pl + '" x2="' + (W - pr) + '" y1="' + (H - pb) + '" y2="' + (H - pb) + '"/>';
    svg += '<path class="g-area" d="' + area + '"/><polyline class="g-linea" points="' + linea + '"/>';
    puntos.forEach((p, i) => { svg += '<circle class="' + (i === puntos.length - 1 ? "g-fin" : "g-punto") + '" cx="' + x(i).toFixed(1) + '" cy="' + y(p.v).toFixed(1) + '" r="' + (i === puntos.length - 1 ? 4.5 : 3) + '"/>'; });
    svg += '<text class="g-txt" x="' + pl + '" y="' + (y(max) - 5) + '">' + num(Math.round(max * 10) / 10) + " " + unidad + "</text>";
    svg += '<text class="g-txt" x="' + pl + '" y="' + (H - 6) + '">' + fechaCorta(puntos[0].f) + "</text>";
    svg += '<text class="g-txt" x="' + (W - pr) + '" y="' + (H - 6) + '" text-anchor="end">' + fechaCorta(puntos[puntos.length - 1].f) + "</text>";
    return svg + "</svg>";
  }
  function refrescarDetalle() {
    const e = ejercicioVivo(detalleId);
    if (!e) { if ($("detalle").open) $("detalle").close(); return; }
    const st = estadisticas(e.id);
    const rec = $("detRecords");
    rec.textContent = "";
    if (!st.lista.length) rec.innerHTML = '<p class="vacio-lista">Aún no hay series. Añádelas desde un día de la semana con «+ Ejercicio».</p>';
    else if (st.mejor) {
      rec.appendChild(recuadro("Peso máximo", num(st.mejor.peso) + " kg", "× " + st.mejor.reps + " · " + fechaCorta(st.mejor.fecha), true));
      rec.appendChild(recuadro("1RM estimado", num(Math.round(rm(st.mejorRm))) + " kg", serieTexto(st.mejorRm) + " · " + fechaCorta(st.mejorRm.fecha)));
      rec.appendChild(recuadro("Sesiones", String(st.sesiones.length), st.lista.length + " series"));
    } else {
      rec.appendChild(recuadro("Más repeticiones", st.mejorReps.reps + " reps", fechaCorta(st.mejorReps.fecha), true));
      rec.appendChild(recuadro("Sesiones", String(st.sesiones.length), st.lista.length + " series"));
    }
    const conPeso = !!st.mejor;
    $("detGraficaTit").textContent = conPeso ? "Progreso · 1RM estimado" : "Progreso · repeticiones";
    const puntos = (st.sesiones || []).slice(-12).map(s => ({ f: s.fecha, v: conPeso ? Math.max.apply(null, s.series.filter(x => +x.peso > 0).map(rm).concat(0)) : Math.max.apply(null, s.series.map(x => +x.reps)) }));
    $("detGrafica").innerHTML = grafica(puntos, conPeso ? "kg" : "reps");
    const hist = $("detHistorial"), prs = prsDe(st.lista);
    hist.textContent = "";
    (st.sesiones || []).slice().reverse().forEach(s => {
      const li = document.createElement("li");
      li.innerHTML = '<span class="h-f"></span><span class="h-s"></span>';
      li.querySelector(".h-f").textContent = fechaCorta(s.fecha);
      s.series.sort((a, b) => a.orden - b.orden).forEach(x => {
        const sp = document.createElement("span");
        sp.textContent = serieTexto(x) + (prs.has(x.id) ? " PR" : "");
        if (prs.has(x.id)) sp.className = "es-pr";
        li.querySelector(".h-s").appendChild(sp);
      });
      hist.appendChild(li);
    });
  }
  function abrirDetalle(id) {
    const e = ejercicioVivo(id);
    if (!e) return;
    detalleId = id;
    $("detNombre").value = e.nombre;
    $("detVideo").value = e.video_url;
    $("detNotas").value = e.notas || "";
    $("detBorrar").classList.remove("confirmar");
    $("detBorrar").textContent = "Eliminar ejercicio";
    pintarVideo(e);
    refrescarDetalle();
    if (!$("detalle").open) $("detalle").showModal();
    $("detalle").scrollTop = 0;
  }
  const editarEjercicio = cambios => { const e = ejercicioVivo(detalleId); if (e) cambiar("ejercicios", { ...e, ...cambios }); };
  $("detNombre").addEventListener("change", () => {
    const n = $("detNombre").value.trim();
    if (!n) { $("detNombre").value = db.ejercicios[detalleId].nombre; return; }
    editarEjercicio({ nombre: n });
    pintarVideo(db.ejercicios[detalleId]);
  });
  $("detVideo").addEventListener("change", () => {
    let u = $("detVideo").value.trim();
    if (u && !/^https?:\/\//i.test(u)) u = "https://" + u;
    $("detVideo").value = u;
    editarEjercicio({ video_url: u });
    pintarVideo(db.ejercicios[detalleId]);
  });
  $("detNotas").addEventListener("change", () => editarEjercicio({ notas: $("detNotas").value }));
  $("detBorrar").addEventListener("click", () => {
    const b = $("detBorrar");
    if (!b.classList.contains("confirmar")) { b.classList.add("confirmar"); b.textContent = "Pulsa otra vez para eliminarlo con todas sus series"; return; }
    editarEjercicio({ borrado: true });
    $("detalle").close();
  });
  $("detalle").addEventListener("close", () => {
    $("detEmbed").textContent = "";   // para que el vídeo deje de sonar
    pintarTodo();
  });

  // ---------- Navegación ----------
  function irA(n) {
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    desplazamiento = n;
    pintarSemana();
  }
  $("antBtn").addEventListener("click", () => irA(desplazamiento - 1));
  $("sigBtn").addEventListener("click", () => irA(desplazamiento + 1));
  $("hoyBtn").addEventListener("click", () => irA(0));

  function verPestana(cual) {
    const ej = cual === "ejercicios";
    $("tabSemana").setAttribute("aria-selected", String(!ej));
    $("tabEjercicios").setAttribute("aria-selected", String(ej));
    $("vistaSemana").hidden = ej;
    $("vistaEjercicios").hidden = !ej;
    escribir("pestana-v1", cual);
    if (ej) pintarCatalogo(); else pintarSemana();
  }
  $("tabSemana").addEventListener("click", () => verPestana("semana"));
  $("tabEjercicios").addEventListener("click", () => verPestana("ejercicios"));

  function pintarTodo() {
    rellenar();
    pintarBloques(false);
    if (!$("vistaEjercicios").hidden) pintarCatalogo();
    if ($("detalle").open) refrescarDetalle();
  }

  // Sincronizar al abrir, al volver a la app, al recuperar conexión y cada 30 s
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { if (!$("vistaSemana").hidden && !escribiendoSerie()) pintarSemana(); sincronizar(); } });
  addEventListener("online", sincronizar);
  setInterval(() => { if (!document.hidden) sincronizar(); }, 30000);

  // ---------- Inicio de sesión ----------
  let creando = false;
  $("modoBtn").addEventListener("click", () => {
    creando = !creando;
    $("loginBtn").textContent = creando ? "Crear cuenta" : "Entrar";
    $("modoBtn").textContent = creando ? "Ya tengo cuenta" : "¿Primera vez? Crear cuenta";
    $("password").autocomplete = creando ? "new-password" : "current-password";
    $("loginTexto").textContent = creando
      ? "Elige tu email y una contraseña de al menos 6 caracteres. Con ellos entrarás en el iPhone y en el Mac."
      : "Entra con tu email y tu contraseña. Solo hace falta una vez en cada dispositivo.";
    $("loginError").textContent = "";
  });
  const traducir = m => /invalid login/i.test(m) ? "Email o contraseña incorrectos."
    : /already registered|already exists/i.test(m) ? "Ya existe una cuenta con ese email. Pulsa «Ya tengo cuenta» y entra."
    : /at least 6|password should/i.test(m) ? "La contraseña debe tener al menos 6 caracteres."
    : /signups not allowed|signup is disabled/i.test(m) ? "No se pueden crear cuentas nuevas. Entra con tu cuenta."
    : /valid email|invalid format/i.test(m) ? "Escribe un email válido."
    : m || "No se ha podido entrar.";
  $("loginForm").addEventListener("submit", async e => {
    e.preventDefault();
    const email = $("email").value.trim(), password = $("password").value;
    if (!email || password.length < 6) { $("loginError").textContent = "Escribe tu email y una contraseña de al menos 6 caracteres."; return; }
    $("loginBtn").disabled = true; $("loginError").textContent = "";
    try {
      const ruta = creando ? "/auth/v1/signup" : "/auth/v1/token?grant_type=password";
      const r = await fetch(SUPA + ruta, { method: "POST", headers: { apikey: CLAVE, "Content-Type": "application/json" }, body: JSON.stringify({ email, password }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok || !j.access_token) throw new Error(traducir(j.msg || j.error_description || j.message || ""));
      if (leer("entrenos-dueno") !== j.user.id) {
        db = { entrenos: {}, ejercicios: {}, series: {} }; cursores = {}; enEspera = {};
        guardarLocal(); guardarEspera(); escribir("entrenos-dueno", j.user.id);
      }
      guardarSesion(j);
      $("password").value = "";
      mostrarApp();
    } catch (err) {
      $("loginError").textContent = navigator.onLine === false ? "Necesitas conexión para entrar la primera vez." : err.message;
    } finally {
      $("loginBtn").disabled = false;
    }
  });
  function cerrarSesion(msg) {
    sesion = null; escribir("sesion-v1", null);
    $("app").hidden = true; $("login").hidden = false;
    $("loginError").textContent = msg || "";
  }
  $("salirBtn").addEventListener("click", () => {
    if (hayPendientes()) { setEstado("Hay cambios sin subir. Conéctate a internet antes de cerrar sesión.", true); return; }
    cerrarSesion("");
  });
  function mostrarApp() {
    $("login").hidden = true; $("app").hidden = false;
    verPestana(leer("pestana-v1") === "ejercicios" ? "ejercicios" : "semana");
    setEstado("Sincronizando…");
    sincronizar();
  }

  if (sesion) mostrarApp(); else $("login").hidden = false;

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
